name: QuietWard Response v1 one-shot final qualification

on:
  workflow_run:
    workflows: ["Temporary v1 qualification"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  qualify:
    if: github.event.workflow_run.id == 32310290135
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout final Response release branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase2-secure-integration
          fetch-depth: 0

      - name: Checkout QuietWard integration branch
        run: git clone --branch feature/response-platform-integration https://github.com/LUKEcheadle-ship-it/quietward.git ../quietward

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Confirm final release metadata
        run: |
          set -euo pipefail
          python scripts/promote_v1.py --check
          PYTHONPATH=backend python - <<'PY'
from app import __version__
assert __version__ == '1.0.0', __version__
print('response_version=' + __version__)
PY

      - name: Run complete final v1 automated gates
        env:
          CI: 'true'
        run: |
          set -o pipefail
          python scripts/finalize_v1.py --quietward-repo ../quietward 2>&1 | tee /tmp/qwr-finalizer.log

      - name: Smoke every shipped UI route against a live stack
        env:
          QWR_ENVIRONMENT: development
          QWR_DATABASE_URL: sqlite:///./ui-smoke.db
          QWR_API_HOST: 127.0.0.1
          QWR_API_PORT: '8002'
          QWR_ENROLLMENT_TOKEN: v1-ui-smoke-enrollment-token-20260819
          QWR_SEED_DEMO: 'false'
          NEXT_PUBLIC_API_URL: http://localhost:8002
        run: |
          set -euo pipefail
          rm -f .env backend/ui-smoke.db backend/ui-smoke.db-shm backend/ui-smoke.db-wal
          python scripts/bootstrap_local.py > /tmp/qwr-ui-smoke.log 2>&1 &
          STACK_PID=$!
          cleanup() {
            kill "$STACK_PID" 2>/dev/null || true
            wait "$STACK_PID" 2>/dev/null || true
            rm -f .env backend/ui-smoke.db backend/ui-smoke.db-shm backend/ui-smoke.db-wal
          }
          trap cleanup EXIT
          for _ in $(seq 1 90); do
            if ! kill -0 "$STACK_PID" 2>/dev/null; then
              cat /tmp/qwr-ui-smoke.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8002/health >/dev/null && curl --fail --silent http://127.0.0.1:3001/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8002/health >/dev/null
          curl --fail --silent http://127.0.0.1:3001/ >/dev/null
          .venv/bin/python scripts/seed_demo.py --api-url http://127.0.0.1:8002
          for route in / /agents /events /hosts /incidents; do
            curl --fail --silent "http://127.0.0.1:3001${route}" >/dev/null
          done
          INCIDENT_ID="$(python - <<'PY'
import json
from urllib.request import urlopen
with urlopen('http://127.0.0.1:8002/api/v1/incidents', timeout=10) as response:
    rows=json.load(response)
assert rows
print(rows[0]['incident_id'])
PY
)"
          curl --fail --silent "http://127.0.0.1:3001/incidents/${INCIDENT_ID}" >/dev/null
          curl --fail --silent "http://127.0.0.1:8002/api/v1/incidents/${INCIDENT_ID}" >/dev/null
          curl --fail --silent http://127.0.0.1:8002/api/v1/audit/verify | python -c "import json,sys; v=json.load(sys.stdin); assert v['valid'] is True, v"
          echo "QUIETWARD_RESPONSE_V1_FINAL_UI_SMOKE: PASS" | tee -a /tmp/qwr-ui-smoke.log

      - name: Report final success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE_SHA="$(git rev-parse HEAD)"
          QUIETWARD_SHA="$(git -C ../quietward rev-parse HEAD)"
          gh pr comment 2 --repo LUKEcheadle-ship-it/quietward-response --body "FINAL_V1_QUALIFICATION: PASS

Response head: \`$RESPONSE_SHA\`
QuietWard head: \`$QUIETWARD_SHA\`

- Response full gate: PASS
- migrations + Alembic drift + Phase1 upgrade: PASS
- frontend typecheck/build/npm high audit: PASS
- QuietWard full suite/public audit: PASS
- real two-repository HTTP acceptance: PASS
- exactly-once demo action + signed result: PASS
- audit verification: PASS
- live UI route smoke: PASS"

      - name: Report final failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'FINAL_V1_QUALIFICATION: FAIL'
            echo
            echo '```text'
            if [ -f /tmp/qwr-finalizer.log ]; then tail -n 220 /tmp/qwr-finalizer.log; fi
            if [ -f /tmp/qwr-ui-smoke.log ]; then tail -n 140 /tmp/qwr-ui-smoke.log; fi
            echo '```'
          } > /tmp/qwr-comment.md
          gh pr comment 2 --repo LUKEcheadle-ship-it/quietward-response --body-file /tmp/qwr-comment.md
