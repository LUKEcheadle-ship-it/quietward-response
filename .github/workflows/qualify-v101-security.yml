name: Temporary v1.0.1 security qualification

on:
  push:
    branches:
      - security/v1.0.1-next-16.3.3

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate lockfile for patched Next.js
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.3

      - name: Run complete local Response v1 gate
        run: python scripts/verify_v1.py

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json frontend/package.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json frontend/package.json
          git commit -m "security: refresh lock for Next.js 16.3.3"
          git push origin HEAD:security/v1.0.1-next-16.3.3
