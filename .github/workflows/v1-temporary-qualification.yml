name: Temporary v1 qualification

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout QuietWard Response
        uses: actions/checkout@v4
        with:
          ref: feature/phase2-secure-integration
          fetch-depth: 0

      - name: Checkout QuietWard integration branch
        run: |
          git clone --branch feature/response-platform-integration --single-branch https://github.com/LUKEcheadle-ship-it/quietward.git ../quietward
          git -C ../quietward fetch origin main --prune

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run complete v1 automated gates
        env:
          CI: 'true'
        run: python scripts/finalize_v1.py --quietward-repo ../quietward
