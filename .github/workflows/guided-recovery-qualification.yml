name: Guided recovery qualification
on:
  push:
    branches: [review/guided-recovery-20261013]
permissions:
  contents: read
concurrency:
  group: guided-recovery-20261013
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 972bac1be241f2701d362b6a2e471423f66f8517
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct exact reviewed source
        run: python harness/review/prepare_followup.py candidate "$RUNNER_TEMP/bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: guided-recovery-candidate
          path: ${{ runner.temp }}/bundle/
          retention-days: 7
          if-no-files-found: error
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 972bac1be241f2701d362b6a2e471423f66f8517
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: guided-recovery-candidate
          path: ${{ runner.temp }}/bundle
      - name: Load exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/bundle/candidate.bundle" HEAD
          git checkout --detach a564a9cf1a909ec6c89f78ee0d3ff54b30cdf288
          test "$(git rev-parse HEAD^{tree})" = 7ae76f5a8e784e0de2b7b853f7a2b14d23a4bedc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Full backend with warnings as errors
        working-directory: backend
        run: python -m pytest -W error -o addopts='' -q
      - name: Require all 12 recovery and escalation contracts
        run: python scripts/verify_vnext_resolution_coverage.py
      - name: Native evidence-bound process checks on disposable children only
        run: python scripts/verify_vnext_process_containment.py
      - name: Migration upgrade and schema drift
        shell: python
        run: |
          import os, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='qwr-migration-') as temp:
              env = os.environ.copy()
              env['QWR_DATABASE_URL'] = 'sqlite:///' + (pathlib.Path(temp) / 'upgrade.db').as_posix()
              for args in [('upgrade', '0003_agent_diag_caps'), ('upgrade', 'head'), ('check',)]:
                  subprocess.run([sys.executable, '-m', 'alembic', *args], cwd='backend', env=env, check=True)
      - name: Public source audit and clean tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_public_release.py
          test -z "$(git status --porcelain)"
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 972bac1be241f2701d362b6a2e471423f66f8517
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: guided-recovery-candidate
          path: ${{ runner.temp }}/bundle
      - name: Load exact candidate
        run: |
          git fetch "$RUNNER_TEMP/bundle/candidate.bundle" HEAD
          git checkout --detach a564a9cf1a909ec6c89f78ee0d3ff54b30cdf288
          test "$(git rev-parse HEAD^{tree})" = 7ae76f5a8e784e0de2b7b853f7a2b14d23a4bedc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.txt playwright==1.63.0
          .venv/bin/python -m playwright install --with-deps chromium
          cd frontend
          npm ci
      - name: Frontend typecheck build and dependency audit
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build
          npm audit
      - name: Real multi-analyst recovery and escalation workflow
        run: .venv/bin/python scripts/verify_guided_recovery_browser.py --output "$RUNNER_TEMP/recovery-browser"
      - name: Verify exact receipt and no endpoint execution
        shell: python
        run: |
          import json, os, pathlib, subprocess
          p = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'recovery-browser/receipt.json').read_text())
          assert p['decision'] == 'PASS' and p['source_sha'] == 'a564a9cf1a909ec6c89f78ee0d3ff54b30cdf288'
          assert p['source_dirty'] is False and p['endpoint_actions_created'] == 0 and p['endpoint_agents_started'] == 0
          assert p['verified_recovery_closed'] and p['acknowledged_escalation_remains_unresolved'] and p['audit_chain_valid']
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-recovery-browser-evidence
          path: ${{ runner.temp }}/recovery-browser/
          retention-days: 7
          if-no-files-found: warn
  publish-reviewed-source:
    needs: [native, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guided-incident-response-vnext
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: guided-recovery-candidate
          path: ${{ runner.temp }}/bundle
      - name: Publish tested source to the existing feature branch only
        shell: bash
        run: |
          set -euo pipefail
          feature=refs/heads/feature/guided-incident-response-vnext
          old=972bac1be241f2701d362b6a2e471423f66f8517
          new=a564a9cf1a909ec6c89f78ee0d3ff54b30cdf288
          test "$(git ls-remote origin "$feature" | cut -f1)" = "$old"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 1383bee124b11d09cee27f0226d51b4329c26fde
          git fetch "$RUNNER_TEMP/bundle/candidate.bundle" HEAD
          test "$(git rev-parse "$new^{tree}")" = 7ae76f5a8e784e0de2b7b853f7a2b14d23a4bedc
          git merge-base --is-ancestor "$old" "$new"
          git push --force-with-lease="$feature:$old" origin "$new:$feature"
          test "$(git ls-remote origin "$feature" | cut -f1)" = "$new"
          echo 'Tested feature source published. Main, releases, services and user PCs unchanged.'
