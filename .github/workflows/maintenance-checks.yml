name: Maintenance qualification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows-backend:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Full backend and maintenance boundary tests
        working-directory: backend
        run: python -m pytest -W error -o addopts='' -q
      - name: Public source audit
        run: python scripts/audit_public_release.py
  browser-and-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.txt playwright
          .venv/bin/python -m playwright install --with-deps chromium
          npm ci --prefix frontend
      - name: Typecheck build and dependency audit
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build
          npm audit --audit-level=moderate
      - name: Verify dedicated loopback ports are unused
        run: |
          python - <<'PY'
          import socket
          for port in (8002, 3001):
              with socket.socket() as probe:
                  probe.bind(('127.0.0.1', port))
          PY
      - name: Exercise six routes with synthetic incidents only
        run: .venv/bin/python scripts/verify_frontend_browser.py --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/maintenance-browser"
      - name: Verify browser evidence and unchanged source
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          receipt=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'maintenance-browser/receipt.json').read_text())
          assert receipt['decision']=='PASS'
          assert receipt['source_sha']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert receipt['routes']==6 and not receipt['javascript_errors']
          assert receipt['endpoint_agents_started']==0 and receipt['response_actions_requested']==0
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-browser-evidence
          path: |
            ${{ runner.temp }}/maintenance-browser/receipt.json
            ${{ runner.temp }}/maintenance-browser/*.png
            ${{ runner.temp }}/maintenance-browser/failure.txt
          retention-days: 7
          if-no-files-found: warn
