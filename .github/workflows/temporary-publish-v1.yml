name: Temporary publish v1.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-publish-v1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag and GitHub Release, then attempt public visibility
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 0906983fa6f5c3b925383af8e7c498548eef406e
        run: |
          set -euo pipefail
          git fetch origin --tags
          TAG_TARGET="$(git rev-list -n 1 v1.0.0)"
          test "$TAG_TARGET" = "$TARGET_SHA"

          gh release view v1.0.0 --json tagName,name,isDraft,isPrerelease,url,targetCommitish >/tmp/release.json
          python - <<'PY'
          import json
          value = json.load(open('/tmp/release.json', encoding='utf-8'))
          assert value['tagName'] == 'v1.0.0', value
          assert value['name'] == 'QuietWard Response v1.0.0', value
          assert value['isDraft'] is False, value
          assert value['isPrerelease'] is False, value
          print('RELEASE_VERIFIED=YES')
          PY

          VISIBILITY="blocked"
          if gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -F private=false >/tmp/visibility.json 2>/tmp/visibility.err; then
            if python - <<'PY'
          import json
          value = json.load(open('/tmp/visibility.json', encoding='utf-8'))
          raise SystemExit(0 if value.get('private') is False else 1)
          PY
            then
              VISIBILITY="public"
            fi
          fi

          cat > .github/v1-publication-result.txt <<EOF
          release=v1.0.0
          release_present=yes
          tag_target=${TAG_TARGET}
          release_draft=no
          release_prerelease=no
          visibility=${VISIBILITY}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v1-publication-result.txt
          git commit -m "chore: record temporary v1 publication result"
          git push origin HEAD:main
