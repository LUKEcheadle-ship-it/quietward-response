services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/quietward_response.db
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - response-data:/data
    ports:
      - "8001:8001"

  frontend:
    build:
      context: frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  response-data:
